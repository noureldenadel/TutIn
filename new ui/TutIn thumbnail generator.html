<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TutIn thumbnail generator</title>
<style>
:root{--bg:#f3f1ec;--panel:#fbfaf7;--card:#ffffff;--line:#dedad0;--text:#1b1a17;--muted:#6f6b60;--accent:#d9822b;--btn:#1b1a17;--btntext:#fbfaf7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--panel:#181816;--card:#1c1c1a;--line:#2b2b28;--text:#ecebe6;--muted:#8d8b83;--btn:#ecebe6;--btntext:#121211}}
:root[data-theme="dark"]{--bg:#121211;--panel:#181816;--card:#1c1c1a;--line:#2b2b28;--text:#ecebe6;--muted:#8d8b83;--btn:#ecebe6;--btntext:#121211}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px;display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:720px){.wrap{grid-template-columns:1fr}}
h1{font:600 18px Georgia,"Times New Roman",serif;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.thumb{position:relative;aspect-ratio:16/9;background:#222}
.thumb svg{display:block;width:100%;height:100%}
.badge{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font:600 11px ui-monospace,Consolas,monospace;padding:2px 6px;border-radius:4px}
.body{padding:14px}
.title{font:600 17px/1.25 Georgia,"Times New Roman",serif;margin:0 0 10px}
.who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:14px}
.av{width:26px;height:26px;border-radius:6px;overflow:hidden;flex-shrink:0;display:block}.av svg{display:block;width:100%;height:100%}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}
.meta b{color:var(--text)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
button.go{width:100%;background:var(--btn);color:var(--btntext);border:0;border-radius:8px;padding:10px;font:600 14px inherit;cursor:pointer;margin-bottom:6px}
button.go:active{transform:translateY(1px)}
.seed{color:var(--muted);font:12px ui-monospace,Consolas,monospace;margin-bottom:14px;text-align:center}
.row{display:grid;grid-template-columns:96px 1fr 38px;gap:10px;align-items:center;margin:10px 0}
.row label{color:var(--muted);font-size:13px}
.row output{font:12px ui-monospace,Consolas,monospace;text-align:right}
input[type=range]{width:100%;accent-color:var(--accent)}
select{width:100%;padding:7px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.chk{display:flex;gap:8px;align-items:center;color:var(--muted);margin-top:12px;font-size:13px}
.sw{display:flex;gap:4px;margin:14px 0 0}
.sw span{flex:1;height:18px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Thumbnail generator</h1>
    <p class="sub">One card, seeded and tweakable.</p>
    <div class="card">
      <div class="thumb"><div id="art"></div><span class="badge">4h 20m</span></div>
      <div class="body">
        <p class="title">Product Design Fundamentals</p>
        <div class="who"><span class="av" id="av"></span>Maya Chen</div>
        <div class="bar"><i id="fill"></i></div>
        <div class="meta"><span id="lessons">8 / 12 lessons</span><b id="pct">65%</b></div>
      </div>
    </div>
  </div>
  <div class="panel">
    <button class="go" id="regen">↻ Regenerate</button>
    <div class="seed" id="seedlbl"></div>
    <div class="row"><label>Pattern</label><select id="pattern" style="grid-column:2/4">
      <option value="auto">Auto (from seed)</option><option value="0">Binary ramp</option><option value="1">Thin strips</option><option value="2">Block rows</option><option value="3">Ramp rows</option></select></div>
    <div id="sliders"></div>
    <label class="chk"><input type="checkbox" id="lock"> Keep hue when regenerating</label>
    <div class="sw" id="sw"></div>
  </div>
</div>
<script>
var S={seed:48213,hue:150,drift:25,density:36,variance:50,contrast:60,bands:3,spark:20,progress:65};
var defs=[["hue","Hue",0,360],["drift","Hue drift",-60,60],["density","Density",8,80],["variance","Variance",0,100],["contrast","Contrast",0,100],["spark","Spark accent",0,100],["bands","Bands / rows",2,6],["progress","Progress",0,100]];
var HUES=[142,265,28,8,210,340,175,45];
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hsl(h,s,l){return"hsl("+(((h%360)+360)%360).toFixed(0)+","+s+"%,"+Math.max(4,Math.min(96,l)).toFixed(0)+"%)"}
function palette(){
  var k=0.5+S.contrast/100,L=[13,29,46,62,88],d=S.drift,h=S.hue;
  var pal=[hsl(h,42,50+(L[0]-50)*k),hsl(h+d*.3,46,50+(L[1]-50)*k),hsl(h+d*.6,55,50+(L[2]-50)*k),hsl(h+d,68,50+(L[3]-50)*k),hsl(h+d*.5,70,50+(L[4]-50)*k)];
  return{tones:pal,spark:hsl(h+180,75,60)};
}
function pick(r,p){
  if(r()<S.spark/450)return p.spark;
  var x=r();return p.tones[x<.3?0:x<.5?1:x<.72?2:x<.88?3:4];
}
var W=320,H=180;
function rect(x,y,w,h,c){return'<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(Math.max(.6,w)+.8).toFixed(1)+'" height="'+(Math.max(.6,h)+.8).toFixed(1)+'" fill="'+c+'"/>'}
function hh(s,a,b){var h=(s^Math.imul(a+1,0x9E3779B1)^Math.imul(b+1,0x85EBCA6B))|0;h=Math.imul(h^h>>>16,0x45d9f3b);h=Math.imul(h^h>>>16,0x45d9f3b);h^=h>>>16;return(h>>>0)/4294967296}
function R(a,b){return hh(S.seed,a,b)}
function tn(p,x){return p.tones[1+Math.floor(x*4)%4]}
function cutsFor(i,n,mode,v){var w=[],j,g=1.1+R(7,i)*.25;
  for(j=0;j<n;j++){var x=R(10+i,j);w.push(mode==="ramp"?Math.pow(g,j):mode==="reg"?1+(x-.5)*v*1.2:.25+x*R(40+i,j)*3*(.3+v))}
  if(mode==="ramp"&&R(8,i)<.5)w.reverse();
  var t=0;w.forEach(function(a){t+=a});var b=[0],s=0;w.forEach(function(a){s+=a/t*W;b.push(s)});return b}
function rows(k){return function(r,p){
  var o="",v=S.variance/100,B=S.bands,hs=[],tot=0,i,j,y=0,shared=null,mode=["reg","blocks","ramp"][k];
  for(i=0;i<B;i++){var h=.5+R(1,i)*(1+v*2);hs.push(h);tot+=h}
  var base=k===0?S.density*.8+4:k===1?S.density/6+3:S.density/4+6;
  for(i=0;i<B;i++){
    var rh=hs[i]/tot*H,n=Math.max(3,Math.round(base*(1+(R(2,i)-.5)*v*1.6))),cuts;
    cuts=(shared&&R(6,i)<.55)?shared:cutsFor(i,n,mode,v);
    if(!shared||R(9,i)<.4)shared=cuts;
    var tone=tn(p,R(4,i)),tone2=tn(p,R(5,i)),st=R(3,i);
    for(j=0;j<cuts.length-1;j++){
      var c,q=R(20+i,j);
      if(st<.5)c=j%2?(q<.25?tn(p,R(50+i,j)):tone):null;
      else if(st<.8)c=j%2?tone:tone2;
      else c=q<.2?null:tn(p,R(50+i,j));
      if(c&&R(30+i,j)<S.spark/450)c=p.spark;
      if(c)o+=rect(cuts[j],y,cuts[j+1]-cuts[j],rh,c)}
    y+=rh}
  return o}}
var gens=[
function binaryRamp(r,p){var o="",nb=Math.max(3,Math.min(7,S.bands+1)),bw=W/nb,p0=H/S.density*2,v=S.variance/100,duty=.34+R(1,0)*.16;
  for(var b=0;b<nb;b++){var per=p0*Math.pow(2,b),off=per*(v>.5?R(2,b):[0,.25,.5][Math.floor(R(2,b)*3)]),c=R(3,b)<v*.4?p.tones[2+Math.floor(R(4,b)*3)]:p.tones[3];
    for(var y=-off;y<H;y+=per)o+=rect(b*bw,y,bw,per*duty,c)}
  return o},
rows(0),rows(1),rows(2)
];
function avatar(p){
  var k=1+Math.floor(hh(S.seed*31+7,0,0)*3),bg=p.tones[k],fg=k<3?p.tones[4]:p.tones[0];
  return '<svg viewBox="0 0 24 24"><rect width="24" height="24" fill="'+bg+'"/><text x="12" y="12" dy=".35em" text-anchor="middle" fill="'+fg+'" font-family="ui-monospace,Consolas,monospace" font-size="9.5" font-weight="700">MC</text></svg>'}
function render(){
  var r=rng(S.seed),p=palette(),pv=document.getElementById("pattern").value,g=pv==="auto"?S.seed%4:+pv,fl=(S.seed>>3)%2;
  document.getElementById("art").innerHTML='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges">'+rect(0,0,W,H,p.tones[0])+'<g'+(fl?' transform="translate(320,0) scale(-1,1)"':'')+'>'+gens[g](R,p)+'</g></svg>';
  document.getElementById("fill").style.cssText="width:"+S.progress+"%;background:"+p.tones[3];
  document.getElementById("pct").textContent=S.progress+"%";
  document.getElementById("av").innerHTML=avatar(p);
  document.getElementById("lessons").textContent=Math.round(S.progress*.12)+" / 12 lessons";
  document.getElementById("seedlbl").textContent="seed "+S.seed+" · "+["binary ramp","thin strips","block rows","ramp rows"][g];
  document.getElementById("sw").innerHTML=p.tones.concat([p.spark]).map(function(c){return'<span style="background:'+c+'"></span>'}).join("");
}
var box=document.getElementById("sliders");
defs.forEach(function(d){
  var row=document.createElement("div");row.className="row";
  row.innerHTML='<label>'+d[1]+'</label><input type="range" id="s_'+d[0]+'" min="'+d[2]+'" max="'+d[3]+'" value="'+S[d[0]]+'"><output id="o_'+d[0]+'">'+S[d[0]]+'</output>';
  box.appendChild(row);
  row.querySelector("input").addEventListener("input",function(e){S[d[0]]=+e.target.value;document.getElementById("o_"+d[0]).textContent=e.target.value;render()});
});
function setUI(k){document.getElementById("s_"+k).value=S[k];document.getElementById("o_"+k).textContent=S[k]}
document.getElementById("pattern").addEventListener("change",render);
document.getElementById("regen").addEventListener("click",function(){
  S.seed=Math.floor(Math.random()*99999);var r=rng(S.seed);
  if(!document.getElementById("lock").checked){S.hue=HUES[Math.floor(r()*HUES.length)];setUI("hue")}
  S.drift=Math.round((r()-.5)*80);setUI("drift");render();
});
render();
</script>
</body>
</html>
